name: static/server Build
on:
  push:
    branches: [master, monster]
    paths:
      - .github/workflows/auth-*
      - app/static/server/**
      - app/shared/src/**

  pull_request:
    paths:
      - .github/workflows/auth-*
      - app/static/server/**
      - app/shared/src/**

jobs:
  static-server-build:
    name: "static/server build"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app/static/app/server

    steps:
      - uses: actions/checkout@v3
        with:
          sparse-checkout: "app/static/app/server"
          sparse-checkout-cone-mode: false

      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.9.x

      - name: Build
        run: deno task build
