name: static/client Build
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/static-*
      - app/static/app/client/**
      - app/shared/src/**

  pull_request:
    paths:
      - .github/workflows/static-*
      - app/static/app/client/**
      - app/shared/src/**

jobs:
  static-client-build:
    name: "static/client build"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app/static/app/client

    steps:
      - uses: actions/checkout@v3
        with:
          sparse-checkout: |
            app/static/app/client
            app/shared
            deno.json
            deno.lock
          sparse-checkout-cone-mode: false

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v1
        with:
          node-version: 22.x

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn run build
