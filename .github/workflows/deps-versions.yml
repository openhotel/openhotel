name: deps-versions

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that shared dependencies use the same version
        shell: python3 {0}
        run: |
          import json, re, sys, collections
          from pathlib import Path

          IGNORE = ("node_modules", "app/shared/old")
          files = [
              p for name in ("deno.json", "package.json")
              for p in Path(".").rglob(name)
              if not any(i in p.as_posix() for i in IGNORE)
          ]

          # package -> version -> [(file, key)]
          found = collections.defaultdict(lambda: collections.defaultdict(list))

          def add(file, key, spec):
              if key.endswith("/") or spec.startswith((".", "/", "file:", "link:")):
                  return
              m = re.match(r"^(jsr|npm):(@?[^@]+)@?(.*)$", spec)
              if m:
                  pkg, ver = m.group(2), m.group(3) or "(none)"
              elif spec.startswith("http"):
                  pkg, ver = key, spec
              else:
                  pkg, ver = key, spec
              m = re.match(r"^@jsr/([^_]+)__(.+)$", pkg)
              if m:
                  pkg = f"@{m.group(1)}/{m.group(2)}"
              found[pkg][ver].append((file, key))

          for f in files:
              try:
                  data = json.loads(f.read_text())
              except Exception as e:
                  print(f"::error file={f}::invalid JSON: {e}")
                  sys.exit(1)
              if f.name == "deno.json":
                  for k, v in data.get("imports", {}).items():
                      add(f.as_posix(), k, v)
              for section in ("dependencies", "devDependencies", "peerDependencies"):
                  for k, v in data.get(section, {}).items():
                      add(f.as_posix(), k, v)

          mismatches = {p: v for p, v in sorted(found.items()) if len(v) > 1}
          if not mismatches:
              print(f"OK: {len(found)} packages, all versions match")
              sys.exit(0)

          print(f"{len(mismatches)} of {len(found)} packages have different versions:\n")
          for pkg, versions in mismatches.items():
              print(f"{pkg}")
              for ver, uses in sorted(versions.items()):
                  for file, key in uses:
                      print(f"  {ver:<20} {file}  ({key})")
                      print(f"::error file={file}::{pkg} is {ver} here, other files use "
                            + ", ".join(v for v in versions if v != ver))
              print()
          sys.exit(1)
