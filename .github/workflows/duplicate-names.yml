name: duplicate-names

on:
  push:
    branches: [master]
  pull_request:

jobs:
  duplicate-names:
    name: "duplicate types/enums/consts"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Fails when an exported type, interface, enum or UPPER_CASE const is
      # declared with the same name in more than one file. Lists all of them first.
      # Ignore one declaration with `// @ignore-duplicate` on the line above it
      # (or at the end of the same line).
      - name: Find duplicated names
        shell: python3 {0}
        run: |
          import re, os, sys, collections, hashlib

          SKIP_DIRS = {"node_modules", "build", "dist", ".git", "__tests__"}
          SKIP_PATHS = ("app/shared/old",)
          DECL = re.compile(
              r"^export\s+(?:declare\s+)?(?:(type|interface|enum|const\s+enum)\s+([A-Za-z_$][\w$]*)"
              r"|const\s+([A-Z][A-Z0-9_]*)\b)",
              re.M,
          )

          IGNORE = "@ignore-duplicate"
          found = collections.defaultdict(list)  # name -> [(kind, file, line, hash)]
          for dp, dn, fn in os.walk("app"):
              dn[:] = [d for d in dn if d not in SKIP_DIRS]
              if dp.startswith(SKIP_PATHS):
                  continue
              for n in fn:
                  if not n.endswith((".ts", ".tsx")) or n.endswith(".d.ts"):
                      continue
                  path = os.path.join(dp, n)
                  src = open(path, encoding="utf-8", errors="ignore").read()
                  lines = src.split("\n")
                  matches = list(DECL.finditer(src))
                  for i, m in enumerate(matches):
                      line = src.count("\n", 0, m.start()) + 1
                      prev = lines[line - 2] if line > 1 else ""
                      if IGNORE in lines[line - 1] or (IGNORE in prev and prev.strip().startswith(("//", "/*", "*"))):
                          continue
                      kind = (m.group(1) or "const").split()[-1]
                      name = m.group(2) or m.group(3)
                      end = matches[i + 1].start() if i + 1 < len(matches) else len(src)
                      body = re.sub(r"\s+", "", re.sub(r"//[^\n]*", "", src[m.start():end]))
                      found[name].append((kind, path, line, hashlib.md5(body.encode()).hexdigest()))

          dups = {n: v for n, v in sorted(found.items()) if len({f for _, f, _, _ in v}) > 1}
          same = sum(1 for v in dups.values() if len({h for *_, h in v}) == 1)

          print(f"{len(dups)} duplicated names ({same} identical, {len(dups) - same} different)\n")
          for name, items in dups.items():
              identical = len({h for *_, h in items}) == 1
              label = "identical" if identical else "different"
              print(f"{name} ({items[0][0]}, {label})")
              others = lambda f: ", ".join(p for _, p, _, _ in items if p != f)
              for kind, path, line, _ in items:
                  print(f"  {path}:{line}")
                  print(f"::error file={path},line={line}::{kind} {name} also declared in {others(path)} ({label})")
              print()

          if dups:
              sys.exit(1)
          print("No duplicated names")
