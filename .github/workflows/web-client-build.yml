name: web/client Build
on:
  push:
    branches: [master, monster]
    paths:
      - .github/workflows/web-*
      - app/web/client/**
      - app/shared/src/**

  pull_request:
    paths:
      - .github/workflows/web-*
      - app/web/client/**
      - app/shared/src/**

jobs:
  web-client-build:
    name: "web/client build"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app/web/app/client

    steps:
      - uses: actions/checkout@v3
        with:
          sparse-checkout: "app/web/app/client"
          sparse-checkout-cone-mode: false

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v1
        with:
          node-version: 22.x

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn run build
