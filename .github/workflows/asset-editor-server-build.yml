name: asset-editor/server Build
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/asset-editor-*
      - app/asset-editor/app/server/**
      - app/shared/src/**

  pull_request:
    paths:
      - .github/workflows/asset-editor-*
      - app/asset-editor/app/server/**
      - app/shared/src/**

jobs:
  asset-editor-server-build:
    name: "asset-editor/server build"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app/asset-editor/app/server

    steps:
      - uses: actions/checkout@v3
        with:
          sparse-checkout: |
            app/asset-editor/app/server
            app/shared
            deno.json
            deno.lock
          sparse-checkout-cone-mode: false

      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.9.x

      - name: Build
        run: deno task build
