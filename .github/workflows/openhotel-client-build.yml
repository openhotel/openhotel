name: openhotel/client build
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/openhotel-*
      - app/openhotel/app/client/**
      - app/shared/src/**

  pull_request:
    paths:
      - .github/workflows/openhotel-*
      - app/openhotel/app/client/**
      - app/shared/src/**

jobs:
  openhotel-client-build:
    name: "openhotel/client build"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app/openhotel

    steps:
      - uses: actions/checkout@v3
        with:
          sparse-checkout: |
            app/openhotel
            app/shared
            deno.json
            deno.lock
          sparse-checkout-cone-mode: false

      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.9.x

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v1
        with:
          node-version: 22.x

      - name: Enable Corepack
        run: corepack enable

      - name: Build
        run: deno task build --debug --target=* --client --zip
