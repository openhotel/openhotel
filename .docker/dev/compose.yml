name: openhotel-dev

x-dev: &dev
  image: openhotel-dev
  network_mode: service:net
  depends_on: [net]
  restart: unless-stopped
  tty: true

services:
  net:
    image: alpine
    container_name: net
    command: sleep infinity
    ports:
      - "1994:1994" # client
      - "2024:2024" # auth
      - "2025:2025" # web
      - "9400:9400" # onet
      - "2030:2030" # asset-editor
      - "1995:1995" # static
      - "9000:9000" # s3
      - "8025:8025" # mail

  s3:
    image: chrislusf/seaweedfs:latest
    container_name: s3
    network_mode: service:net
    depends_on: [net]
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - ./s3/config.json:/etc/seaweedfs/s3.json:ro
      - s3-data:/data

  mail:
    image: axllent/mailpit:latest
    container_name: mail
    network_mode: service:net
    depends_on: [net]
    restart: unless-stopped
    command: >-
      --smtp-tls-cert sans:localhost
      --smtp-tls-key sans:localhost
      --smtp-require-tls
      --smtp-auth-accept-any

  auth:
    <<: *dev
    container_name: auth
    depends_on:
      net:
        condition: service_started
      mail:
        condition: service_healthy
    build:
      context: .
      args:
        DENO_VERSION: ${DENO_VERSION:-2.9.7}
    working_dir: /src/app/auth
    command: bash -c "deno task install && deno task start"
    healthcheck:
      test: curl -fs http://localhost:20240/api/v3/_/version
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5m
    volumes:
      - ../..:/src
      - /src/node_modules
      - /src/app/auth/node_modules
      - /src/app/auth/app/client/node_modules
      - deno-cache:/root/.cache/deno

  client:
    <<: *dev
    container_name: client
    depends_on:
      net:
        condition: service_started
      auth:
        condition: service_healthy
      onet:
        condition: service_healthy
    working_dir: /src/app/openhotel
    command: bash -c "deno task install && deno task start"
    volumes:
      - ../..:/src
      - /src/node_modules
      - /src/app/openhotel/node_modules
      - /src/app/openhotel/app/client/node_modules
      - /src/app/openhotel/app/server/node_modules
      - deno-cache:/root/.cache/deno

  onet:
    <<: *dev
    container_name: onet
    depends_on:
      net:
        condition: service_started
      auth:
        condition: service_healthy
    working_dir: /src/app/onet
    command: bash -c "deno task start"
    healthcheck:
      test: curl -fs http://localhost:9400/api/v1/version
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5m
    volumes:
      - ../..:/src
      - /src/node_modules
      - /src/app/onet/node_modules
      - deno-cache:/root/.cache/deno

  web:
    <<: *dev
    container_name: web
    depends_on:
      net:
        condition: service_started
      auth:
        condition: service_healthy
    working_dir: /src/app/web
    command: bash -c "deno task install && deno task start"
    volumes:
      - ../..:/src
      - /src/node_modules
      - /src/app/web/node_modules
      - /src/app/web/app/client/node_modules
      - deno-cache:/root/.cache/deno

  asset-editor:
    <<: *dev
    container_name: asset-editor
    working_dir: /src/app/asset-editor
    command: bash -c "deno task install && deno task start"
    volumes:
      - ../..:/src
      - /src/node_modules
      - /src/app/asset-editor/node_modules
      - /src/app/asset-editor/app/client/node_modules
      - /src/app/asset-editor/app/server/node_modules
      - deno-cache:/root/.cache/deno

  static:
    <<: *dev
    container_name: static
    working_dir: /src/app/static
    command: bash -c "deno task install && deno task start"
    volumes:
      - ../..:/src
      - /src/node_modules
      - /src/app/static/node_modules
      - /src/app/static/app/client/node_modules
      - deno-cache:/root/.cache/deno

volumes:
  deno-cache:
  s3-data:
